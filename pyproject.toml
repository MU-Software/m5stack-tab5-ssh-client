[project]
name = "m5stack-tab5-ssh-client"
version = "0.1.0"
description = "SSH client for M5Stack Tab5"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "esp-idf-monitor==1.11.0",
    "esptool==5.6.0",
    "jsonschema==4.26.0",
    "pyserial==3.5",
    "typer==0.29.1",
]

[dependency-groups]
dev = ["pre-commit==4.7.0"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# docker and ssh with argument lists
"tools/ide.py" = ["S603", "S607"]
"tools/device.py" = ["S603", "S607"]

[tool.mypy]
strict = true

[tool.bandit]
exclude_dirs = ["third_party", ".venv", "build"]
# subprocess without a shell; B602 (shell=True) stays on
skips = ["B404", "B603", "B607"]
