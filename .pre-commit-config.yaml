# SPDX-License-Identifier: GPL-3.0-or-later
default_language_version: { python: python3.13 }
default_stages: [pre-commit, pre-push]
exclude: ^(third_party|patches)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: pretty-format-json
        exclude: ^main/ui\.json$
      - id: trailing-whitespace
        exclude_types: [markdown]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [typer==0.27.3, esptool==5.3.1, jsonschema==4.26.0, types-jsonschema]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.6
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        language: system
        entry: cppcheck
        args:
          - --enable=warning,style,performance,portability
          - --std=c11
          - --error-exitcode=1
          - --suppressions-list=.cppcheck-suppressions
          - --inline-suppr
          - --quiet
        files: \.c$
      - id: clang-tidy
        name: clang-tidy (IDF container)
        language: script
        entry: tools/clang-tidy.sh
        files: \.c$
        require_serial: true
        exclude: ^c6/
